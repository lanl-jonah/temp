spec:
  contents:
    openapi: 3.0.0
    servers:
      - url: https://api.bankong.cloud/transactions/v1
      - url: https://bankong.service-conncetivity.com/api/v1/transactions
    tags:
      - name: BanKonG
        description: All APIs related to BanKonG
      - name: Transactions
        description: Operations about transactions
    info:
      contact:
        email: sven@konghq.com
        url: https://svenwal.de
        name: Sven Walther
      description: >
        The BanKong transactions backend is available to all our customers after
        having signed in.


        It provides access to all you recent transactions and you can create new
        transactions.


        For testing purposes feel free to use the `transactionsKey` api key


        All documentation and self service for an API key are available at the
        [BanKonG developer portal](https://developer.bankong.cloud/).
      title: BanKonG transactions
      version: 1.3.0
    paths:
      /:
        get:
          description: Gets a list of all transaction
          operationId: listAllTransactions
          responses:
            "200":
              description: A list of all your transactions
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Transactions"
          summary: List transactions
          tags:
            - BanKonG
            - Transactions
      /{transaction_id}:
        get:
          description: Get details about a speccific transaction
          operationId: getTransaction
          parameters:
            - in: path
              name: transaction_id
              required: true
              schema:
                type: string
              description: the id of the transaction
          responses:
            "200":
              description: Provides all details about a specific transaction
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/Transaction"
          summary: Get specific transaction
          tags:
            - BanKonG
            - Transactions
          x-kong-plugin-request-validator:
            enabled: true
    components:
      securitySchemes:
        ApiKeyAuth:
          type: apiKey
          in: header
          name: apikey
      schemas:
        Transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        Transaction:
          type: object
          properties:
            source:
              type: string
            senderName:
              type: string
            destination:
              type: string
            amount:
              type: string
            currency:
              type: string
            subject:
              type: string
            id:
              type: string
  meta:
    id: spc_5f5541c0f49f412a9867f65cd0293f7a
    created: 1746115220975
    modified: 1746115220976
